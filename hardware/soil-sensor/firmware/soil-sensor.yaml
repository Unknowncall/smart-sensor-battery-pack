# Soil sensor v1: ESP32-C6, 18650, capacitive probe, SHTC3.
# Pins match hardware/soil-sensor/gen/netlist.py.
#
# First flash: plug USB-C in, `esphome run soil-sensor.yaml`. If the port
# doesn't appear, short the BOOT test pad to GND while plugging in.

substitutions:
  name: soil-sensor
  # Two-point calibration for the probe, in volts at GPIO2.
  # Read "Soil probe voltage" with the probe in dry air and in a glass of water.
  soil_dry_v: "2.10"
  soil_wet_v: "1.00"

esphome:
  name: ${name}
  on_boot:
    priority: -100
    then:
      - output.turn_on: probe_drive
      - output.set_level:
          id: probe_drive
          level: 50%
      - delay: 200ms
      - component.update: soil_voltage
      - output.turn_off: probe_drive
      - component.update: battery_voltage

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: light

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: GPIO22
  scl: GPIO23

output:
  - platform: ledc
    id: probe_drive
    pin: GPIO19
    frequency: 1MHz

sensor:
  - platform: adc
    id: soil_voltage
    name: "Soil probe voltage"
    pin: GPIO2
    attenuation: 12db
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "Soil moisture"
    unit_of_measurement: "%"
    device_class: moisture
    accuracy_decimals: 0
    lambda: return id(soil_voltage).state;
    update_interval: 5s
    filters:
      - calibrate_linear:
          - ${soil_dry_v} -> 0.0
          - ${soil_wet_v} -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: adc
    id: battery_voltage
    name: "Battery voltage"
    pin: GPIO3
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0   # 1M / 1M divider

  - platform: template
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    lambda: return id(battery_voltage).state;
    update_interval: 5s
    filters:
      - calibrate_linear:
          - 3.30 -> 0.0
          - 4.20 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: shtcx
    temperature:
      name: "Air temperature"
    humidity:
      name: "Air humidity"
    update_interval: 5s

deep_sleep:
  id: sleeper
  run_duration: 20s
  sleep_duration: 10min
